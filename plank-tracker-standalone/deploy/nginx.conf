server {
    listen 80;
    server_name plank.mujiabian.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name plank.mujiabian.cn;

    # Replace these paths with the certificate paths created on the server.
    ssl_certificate /etc/letsencrypt/live/plank.mujiabian.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plank.mujiabian.cn/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
